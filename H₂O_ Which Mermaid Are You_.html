<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H₂O: Which Mermaid Are You?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg1:#04283f;--bg2:#0a6a8a;--bg3:#19b8c9;--card:rgba(255,255,255,.12);--card-b:rgba(255,255,255,.28);--text:#f2fcff;--muted:#bfe9f3;--gold:#ffe27a;--emma:#8fd8ff;--rikki:#ff8a3d;--cleo:#3fd0e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%,var(--bg3));background-attachment:fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 18%,rgba(120,255,255,.28),transparent 55%);pointer-events:none;animation:glow 5s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.45}}
#bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#bubbles i{position:absolute;bottom:-40px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(20px);opacity:0}}
main{position:relative;max-width:520px;margin:0 auto;padding:18px 16px 40px}
.screen{display:none;animation:fade .5s ease}.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
.logo{display:block;width:150px;height:150px;margin:8px auto 4px;border-radius:50%;object-fit:cover;box-shadow:0 0 30px rgba(120,255,255,.6);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
h1{font-size:2.1rem;line-height:1.05;text-align:center;margin:10px 0 6px;font-weight:800;text-shadow:0 0 18px rgba(120,255,255,.8)}
.sub{text-align:center;color:var(--muted);font-size:1.1rem;margin:0 0 22px}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:14px 20px;font:700 1.2rem "Baloo 2","Trebuchet MS",sans-serif;color:#04283f;background:linear-gradient(135deg,#fff6b0,var(--gold));box-shadow:0 6px 0 #c9a93a,0 0 24px rgba(255,226,122,.5);cursor:pointer;margin-top:14px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9a93a}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 2px var(--card-b)}
.prog{height:12px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin:6px 0 4px}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cleo),#fff);border-radius:9px;transition:width .5s}
.count{text-align:center;color:var(--muted);margin-bottom:10px}
.q{font-size:1.45rem;line-height:1.2;font-weight:800;text-align:center;margin:12px 0 18px}
.ans{position:relative;overflow:hidden;display:block;width:100%;text-align:left;margin:0 0 12px;padding:15px 16px 15px 54px;border-radius:20px;border:2px solid var(--card-b);background:var(--card);backdrop-filter:blur(4px);color:var(--text);font:600 1.1rem/1.25 "Baloo 2","Trebuchet MS",sans-serif;cursor:pointer;transition:transform .2s,opacity .3s}
.ans::before{content:attr(data-l);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-weight:800}
.ans.picked{border-color:var(--gold);background:rgba(255,226,122,.28);animation:splash .6s}
.ans.dim{opacity:.35;pointer-events:none}.ans.lock{pointer-events:none}
@keyframes splash{30%{transform:scale(1.04);box-shadow:0 0 36px rgba(120,255,255,.9)}}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .8s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.badge{text-align:center;font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:.95rem}
.res{border-radius:28px;padding:18px;margin:10px 0;text-align:center;background:var(--card);border:2px solid var(--card-b);box-shadow:0 0 34px var(--c);animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-6deg);opacity:0}}
.res img{width:70%;max-width:230px;border-radius:22px;border:4px solid var(--c);box-shadow:0 0 28px var(--c)}
.res h2{font-size:1.9rem;margin:10px 0 0;font-weight:800;color:var(--c)}
.res p{margin:6px 0 0;font-size:1.1rem;line-height:1.3}
.mix{text-align:center;font-size:1.1rem;margin:10px 0}
.fall{position:fixed;top:-50px;z-index:50;pointer-events:none;animation:drop linear forwards}
@keyframes drop{to{transform:translateY(112vh) rotate(360deg)}}
.rq{background:var(--card);border:2px solid var(--card-b);border-radius:20px;padding:12px;margin:0 0 12px}
.rq h3{margin:0 0 8px;font-size:1.1rem;line-height:1.2}
.ro{padding:8px 10px;border-radius:12px;margin:5px 0;font-size:1rem;line-height:1.25;color:var(--muted)}
.ro.me{background:rgba(255,226,122,.3);color:#fff;font-weight:700;box-shadow:inset 0 0 0 2px var(--gold)}
.ro.me::before{content:"✓ "}
</style>
</head>

["What would you do if a friend had a serious problem?",["I would help them find a practical solution.","I would stand up for them and tell anyone who caused the problem what I think.","I would listen carefully and give them all the emotional support they need."]],
["Which of these activities would you choose for a free afternoon?",["A relaxing afternoon with a good book or a peaceful swim.","An exciting adventure or a spontaneous trip to a new place.","A fun afternoon with my best friends, perhaps at the beach."]],
["How do you react when someone breaks an important rule?",["I believe rules are there for a reason, so I try to follow them.","I think some rules are made to be broken!","I usually follow the rules, but I can make an exception for someone I love."]],
["What is your biggest strength in a difficult situation?",["I can stay calm and think logically.","I am brave enough to take risks and face challenges.","I can understand other people’s feelings and show kindness."]],
["Imagine that you have discovered a mysterious secret. What would you do?",["I would keep the secret safe and think carefully before doing anything.","I would investigate it immediately because I love an exciting mystery.","I would tell my closest friends because I don’t like dealing with things alone."]],
["Which sentence describes your personality best?",["I am a responsible person who likes having control over a situation.","I am an independent person who doesn’t like being told what to do.","I am a sensitive person who always cares about other people’s feelings."]],
["What would you do if you made a big mistake?",["I would take responsibility and try to fix the situation.","I would admit it, but I wouldn’t let anyone tell me what to do.","I would feel terrible and worry about disappointing the people around me."]],
["What kind of friend are you in a group?",["I am the organised one who makes sure everything goes according to plan.","I am the adventurous one who always comes up with a crazy idea.","I am the caring one who makes sure nobody feels left out."]],
["If you could have one special mermaid power, what would you choose?",["The power to freeze water and control ice.","The power to heat water and make it boil.","The power to control water and move it with my hands."]]
];

var AC=null;
function ctx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){}return AC}
function tone(f1,f2,t0,dur,vol,type){var a=ctx();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=type||"sine";
 o.frequency.setValueAtTime(f1,a.currentTime+t0);o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+dur);
 g.gain.setValueAtTime(0.0001,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol,a.currentTime+t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t0+dur);
 o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+0.05)}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

 busy=false;var q=QS[qi];

 orders[qi].forEach(function(ch,pos){

}
function pick(btn,ch,ev){
 if(busy)return;busy=true;bubbleSound();
 var r=btn.getBoundingClientRect(),x=(ev.clientX||r.left+r.width/2)-r.left,y=(ev.clientY||r.top+r.height/2)-r.top;
 var d=document.createElement("span");d.className="rip";var sz=Math.max(r.width,r.height)*2.2;
 d.style.cssText="width:"+sz+"px;height:"+sz+"px;left:"+(x-sz/2)+"px;top:"+(y-sz/2)+"px";btn.appendChild(d);
 btn.classList.add("picked");
 document.querySelectorAll(".ans").forEach(function(a){if(a!==btn)a.classList.add("dim")});
 picks[qi]=ch;
 setTimeout(function(){qi++;if(qi<QS.length)renderQ();else finish()},750);
}

function finish(){
 var c=[0,0,0];picks.forEach(function(p){c[p]++});var mx=Math.max.apply(null,c);
 var w=[0,1,2].filter(function(i){return c[i]===mx});
 $("cards").innerHTML=w.map(function(i){var m=M[i];
  return '<div class="res" style="--c:'+m.c+'"><img src="'+m.img+'" alt="'+m.n+'"><h2>'+m.e+' You are '+m.n.toUpperCase()+'! '+m.e+'</h2><p>'+m.d+'</p></div>'}).join("");
 $("mix").textContent=w.length>1?"A tie! You have a mixture of two mermaid personalities! You share the best qualities of both girls.":"";
 show("s-result");magicSound();rain(w);
}
function rain(w){
 var set=["🧜‍♀️","🧜‍♀️","🧜‍♀️","🫧","💧"].concat(w.map(function(i){return M[i].e}));
 for(var i=0;i<46;i++)(function(i){setTimeout(function(){
  var e=document.createElement("div");e.className="fall";e.textContent=set[Math.floor(Math.random()*set.length)];
  e.style.left=Math.random()*96+"%";e.style.fontSize=(22+Math.random()*28)+"px";e.style.animationDuration=(2.8+Math.random()*2.6)+"s";
  document.body.appendChild(e);setTimeout(function(){e.remove()},5600)},i*90)})(i);
}

function renderReview(){
 $("list").innerHTML=QS.map(function(q,n){
  return '<div class="rq"><h3>'+(n+1)+'. '+q[0]+'</h3>'+orders[n].map(function(ch,pos){
   return '<div class="ro'+(picks[n]===ch?' me':'')+'"><b>'+"ABC"[pos]+')</b> '+q[1][ch]+'</div>'}).join("")+'</div>'}).join("");
 show("s-review");
}
$("go").onclick=function(){ctx();bubbleSound();start()};
$("review").onclick=renderReview;
$("back").onclick=function(){show("s-result")};
$("again").onclick=$("again2").onclick=function(){bubbleSound();start()};
</script>
</body>
